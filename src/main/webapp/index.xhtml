<ui:composition template="/WEB-INF/templates/layout.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://xmlns.jcp.org/jsf/html"
	xmlns:f="http://xmlns.jcp.org/jsf/core"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ui="http://xmlns.jcp.org/jsf/facelets">

	<ui:param name="titulo" value="Login" />
	<ui:param name="css" value="css/Index.css" />
	<ui:param name="mostrarRodape" value="false" />

	<ui:define name="conteudo">
	<f:event type="preRenderView" listener="#{loginUsuarioBean.avisarSeSessaoExpirou()}" />

	<div class="container">
		<div class="header">
			<h:graphicImage library="imagens" name="logo.png" alt="Logo"
				styleClass="logo" />
			<h1 class="title">SISTEMA DE RELATÓRIOS</h1>
		</div>

		<div class="login-box">
			<h2 class="login-title">LOGIN</h2>

			<h:form id="loginForm" prependId="false">

				<div class="form-group">
					<h:outputLabel for="email" value="E-MAIL" />
					<h:inputText id="email"
						value="#{loginUsuarioBean.emailInput}"
						required="true"
						requiredMessage="E-mail é obrigatório" />
				</div>

				<div class="form-group">
					<h:outputLabel for="senha" value="SENHA" />
					<h:inputSecret id="senha"
						value="#{loginUsuarioBean.senhaInput}"
						required="true"
						requiredMessage="Senha é obrigatória" />
				</div>

				<p:commandButton value="ENTRAR"
					action="#{loginUsuarioBean.autenticar}"
					ajax="false"
					styleClass="btn-entrar" />
			</h:form>

			<h:panelGroup id="painelCriarConta" layout="block">
				<h:form prependId="false" rendered="#{loginUsuarioBean.semUsuarios}">
					<p:commandButton value="CRIAR CONTA"
						onclick="PF('criarContaDialog').show();" type="button"
						styleClass="btn-criar-conta" />
				</h:form>
			</h:panelGroup>
		</div>

		<p:dialog header="Criar Primeira Conta" widgetVar="criarContaDialog"
			modal="true" responsive="true" width="500" closable="true">
			<h:form id="formCriarConta">

				<p:panelGrid columns="2" layout="grid" styleClass="ui-fluid">
					<p:outputLabel for="nomeDialog" value="Nome Completo:" />
					<p:inputText id="nomeDialog" value="#{cadastroUsuarioBean.nome}"
						required="true" requiredMessage="Nome é obrigatório" />

					<p:outputLabel for="emailDialog" value="E-mail:" />
					<p:inputText id="emailDialog" value="#{cadastroUsuarioBean.email}"
						required="true" requiredMessage="E-mail é obrigatório" />

					<p:outputLabel for="senhaDialog" value="Senha:" />
					<p:password id="senhaDialog" value="#{cadastroUsuarioBean.senha}"
						required="true" feedback="false"
						requiredMessage="Senha é obrigatória" />

					<p:outputLabel for="funcaoDialog" value="Função:" />
					<p:inputText id="funcaoDialog"
						value="#{cadastroUsuarioBean.funcao}" />
				</p:panelGrid>

				<p style="text-align: center; color: #666; font-size: 13px; margin-top: 15px;">
					Esta conta será criada como Administrador. A senha deve ter pelo menos 6 caracteres.
				</p>

				<div style="text-align: center; margin-top: 20px;">
					<p:commandButton value="CRIAR CONTA"
						action="#{cadastroUsuarioBean.salvarPrimeiraConta()}"
						update=":growlMsgs :painelCriarConta"
						oncomplete="if (args &amp;&amp; args.salvo) { PF('criarContaDialog').hide(); }"
						styleClass="ui-button-success" style="margin-right: 10px;" />

					<p:commandButton value="CANCELAR"
						onclick="PF('criarContaDialog').hide();" type="button"
						styleClass="ui-button-secondary" />
				</div>
			</h:form>
		</p:dialog>

		<div class="footer">
			<h:outputText value="Sistema Gerenciador de Relatórios" />
		</div>
	</div>
	</ui:define>
</ui:composition>
