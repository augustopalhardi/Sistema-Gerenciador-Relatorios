<!--
  Cabecalho centralizado com o titulo da tela e botao "Voltar".

  Parametros (ui:param):
    titulo          - texto do cabecalho
    voltarHistorico - true: "Voltar" retorna a pagina anterior do navegador;
                      false (padrao): vai para o painel
-->
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://xmlns.jcp.org/jsf/html"
	xmlns:ui="http://xmlns.jcp.org/jsf/facelets">

	<div class="header">
		<h1>#{titulo}</h1>
	</div>
	<div class="header-actions">
		<ui:fragment rendered="#{voltarHistorico}">
			<button type="button" class="exit-button" onclick="window.history.back();">Voltar</button>
		</ui:fragment>
		<ui:fragment rendered="#{not voltarHistorico}">
			<h:link outcome="/home/home.xhtml" styleClass="exit-button" value="Voltar" />
		</ui:fragment>
	</div>
</ui:composition>
